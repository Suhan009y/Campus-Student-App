name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_web_url:
        description: "Public HTTPS URL of the deployed web app (used if APP_WEB_URL repository variable is not set)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_WEB_URL: ${{ vars.APP_WEB_URL || github.event.inputs.app_web_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate deployed app URL
        shell: bash
        run: |
          if [ -z "${APP_WEB_URL:-}" ]; then
            echo "APP_WEB_URL is missing. Add it under Settings > Secrets and variables > Actions > Variables, or run workflow_dispatch and enter the deployed HTTPS URL." >&2
            exit 1
          fi
          node -e 'const u = new URL(process.env.APP_WEB_URL); if (u.protocol !== "https:") { console.error("APP_WEB_URL must use HTTPS"); process.exit(1); } console.log("Building APK for", u.origin);'

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor for this build
        run: npm install --no-save @capacitor/core @capacitor/android @capacitor/cli

      - name: Generate Android project and sync wrapper
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
